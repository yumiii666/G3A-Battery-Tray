; ============================================================
; Battery24GTray 厂商 2.4G 协议适配配置
; ------------------------------------------------------------
; 对应 EasyBluetooth 的社区适配流程（抓包 → 字段定位 → 配置生效）:
;
;  1. 将 2.4G 接收器插入 USB，打开设备管理器，找到该接收器对应的
;     "USB 输入设备 / HID-compliant vendor-defined device"，
;     在 "详细信息 -> 硬件 ID" 中读取 VID 与 PID；
;
;  2. 安装 USBPcap，用 Wireshark 抓取官方驱动软件查询电量时的
;     HID feature report 请求与响应序列；
;
;  3. 分别在两档不同电量下抓包对比，定位响应中随电量变化的
;     字节，即 batteryByte；充电时变化的位即 charging；
;
;  4. 仿照下面的节填好配置并去掉注释，重启本程序即完成适配。
;
; 字段说明:
;   name             显示名称
;   vid              接收器 USB VID（十六进制，如 3554）
;   pids             PID 列表（逗号分隔）；留空匹配该 VID 全部设备
;   mode             feature（默认，控制传输）或 io（中断读写）
;   request          查询请求报文（十六进制，首字节为 report id）
;   responseReportId 响应 report id（默认与请求一致）
;   responseLen      响应长度；0 = 自动（使用设备 feature 长度）
;   batteryByte      电量字节在响应数组中的下标（0 = report id）
;   charging         充电状态位，格式 "字节下标:位掩码"（十六进制掩码）
;   scale            direct（0-100 直读，默认）或 linear（毫伏线性换算）
;   minMv / maxMv    linear 模式下的电压下限/上限
;   ioTimeoutMs      io 模式读取超时（毫秒，默认 300）
; ============================================================

; ---- 示例：迈从（MCHOSE，需按实际抓包结果修改后启用）----
;[mchose]
;name=MCHOSE 2.4G
;vid=3554
;pids=
;mode=feature
;request=05 01 50 00
;responseReportId=05
;responseLen=8
;batteryByte=4
;charging=7:01
;scale=direct
